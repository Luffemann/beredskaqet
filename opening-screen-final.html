<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beredskaqet - Vi åbner officielt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            @apply bg-[#0b0e14] text-white font-sans;
        }
    </style>
</head>
<body class="m-0 p-0">
    <div class="relative min-h-screen w-full bg-[#0b0e14] text-white flex flex-col items-center justify-center p-6 overflow-hidden font-sans">

        <!-- Subtilt taktisk baggrunds-glow -->
        <div class="absolute w-[500px] h-[500px] bg-cyan-500/10 rounded-full blur-[140px] pointer-events-none -top-20 -left-20"></div>
        <div class="absolute w-[450px] h-[450px] bg-orange-500/10 rounded-full blur-[140px] pointer-events-none -bottom-20 -right-20"></div>

        <!-- Centralt indhold -->
        <div class="relative z-10 flex flex-col items-center text-center max-w-2xl mx-auto space-y-8">

            <!-- Logo sektion -->
            <div class="flex flex-col items-center space-y-3">
                <img
                    src="/beredskaqet_logo_beskaarret.png"
                    alt="beredskaqet.dk logo"
                    class="h-28 md:h-36 w-auto object-contain drop-shadow-[0_0_25px_rgba(0,229,255,0.25)]"
                />
            </div>

            <!-- Skrå officiel annoncerings-badge -->
            <div class="transform -rotate-2 hover:rotate-0 transition-transform duration-300">
                <div class="px-8 py-4 rounded-xl border-2 border-orange-500 bg-orange-950/40 backdrop-blur-md shadow-[0_0_35px_rgba(249,115,22,0.4)] flex flex-col items-center gap-1">
                    <span class="text-orange-500 tracking-[0.25em] text-xs md:text-sm font-black uppercase">
                        Vi åbner officielt
                    </span>
                    <span class="text-white text-xl md:text-2xl font-black tracking-wider uppercase drop-shadow-[0_2px_10px_rgba(0,0,0,0.8)]">
                        Torsdag 1. Oktober 2026
                    </span>
                </div>
            </div>

            <!-- Tekst og beskrivelse -->
            <div class="space-y-3 pt-2">
                <h2 class="text-2xl md:text-3xl font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-300 to-cyan-500">
                    Beredskaqet Gaming Hub er klar
                </h2>
                <p class="text-slate-400 text-sm md:text-base max-w-md mx-auto leading-relaxed">
                    Velkommen til CS2 statistik, progression tracking og personlige dashboards.
                </p>
            </div>

        </div>
    </div>
</body>
</html>
